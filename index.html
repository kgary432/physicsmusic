<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Physics of Sound Music</title>
    <meta name="description" content="" />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <p class="eyebrow">listening wall</p>
      <h1>Physics of Sound Music</h1>
      <p class="lede">
        Paste a Spotify song or playlist link. It will be added to the shared
        wall.
      </p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <label class="sr-only" for="spotify-url">Spotify link</label>
      <input
        id="spotify-url"
        name="url"
        type="url"
        inputmode="url"
        placeholder="https://open.spotify.com/track/… or /playlist/…"
        required
      />
      <button type="submit">Add</button>
    </form>
    <p
      id="form-status"
      class="form-status"
      role="status"
      aria-live="polite"
    ></p>

    <div class="toolbar">
      <p id="count-label" class="count">0 items</p>
    </div>

    <section id="empty-state" class="empty">
      <p>Nothing on the wall yet.</p>
      <p class="hint">
        Open Spotify, copy a song or playlist link, and paste it above.
      </p>
    </section>

    <main id="grid" class="grid" hidden></main>

    <script src="config.js?v=6"></script>
    <script src="app.js?v=6"></script>
  </body>
</html>
